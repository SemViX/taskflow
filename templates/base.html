{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TaskFlow — a simple tool for managing your projects and tasks">
    <title>{% block title %}TaskFlow{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    {% block extra_css %}{% endblock extra_css %}
</head>
<body class="bg-light">
    {% include "partials/_navbar.html" %}
    
    <main class="container">
        <div
            id="messages-container"
            hx-get="{% url 'projects:messages' %}"
            hx-trigger="messagesChanged from:body"
            hx-swap="innerHTML"
        >
            {% include "partials/_messages.html" %}
        </div>

        {% block content %}{% endblock content %}
    </main>

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/hyperscript.org@0.9.13"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });
    </script>

    {% block extra_js %}{% endblock extra_js %}
</body>
</html>
