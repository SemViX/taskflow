{% extends "base.html" %}
{% block content %}
<div id="project-list" class="container mt-4">
    <div id="project-form-container"></div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3" id="project-container">
        {% for project in projects %}
            {% include "projects/_project_card.html" %}
        {% empty %}
            <p id="empty-projects-message" class="text-muted">No projects yet.</p>
        {% endfor %}
    </div>

    <button
        hx-get="{% url 'projects:create' %}"
        hx-target="#project-form-container"
        hx-swap="innerHTML"
        class="btn btn-outline-primary mt-3"
    >
        + Add Project List
    </button>
</div>
{% endblock content %}
