<div
    id="task-{{ task.id }}"
    class="list-group-item d-flex flex-wrap align-items-center gap-2 task-row priority-{{ task.get_priority_display|lower }} {% if task.is_done %}done{% endif %}"
>
    <div class="d-flex align-items-center gap-2 flex-grow-1 task-content">
        <input 
            class="form-check-input"
            type="checkbox"
            aria-label="Mark {{ task.title }} as {% if task.is_done %}active{% else %}done{% endif %}"
            {% if task.is_done %}checked{% endif %}
            hx-post="{% url 'tasks:toggle' task.id %}"
            hx-target="#task-{{ task.id }}"
            hx-swap="outerHTML"
        >
        <span class="task-title">{{ task.title }}</span>
        <span class="badge priority-badge">{{ task.get_priority_display }}</span>
        {% if task.deadline %}
            <small class="task-deadline">Due {{ task.deadline|date:"M d" }}</small>
        {% endif %}
    </div>

    <div class="d-flex gap-1 task-actions">
        <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            aria-label="Edit task: {{ task.title }}"
            hx-get="{% url 'tasks:edit' task.id %}"
            hx-target="#task-{{task.id}}"
            hx-swap="outerHTML"
        >
            ✎
        </button>
        <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            aria-label="Delete task: {{ task.title }}"
            hx-delete="{% url 'tasks:delete' task.id %}"
            hx-target="#task-{{ task.id }}"
            hx-swap="outerHTML"
            hx-confirm="Delete this task?"
        >
            ✕
        </button>
    </div>
</div>
