<div 
    id="task-{{task.id}}"
    class="list-group-item d-flex justify-content-between align-items-center task-row priority-{{ task.get_priority_display|lower }} {% if task.is_done %}done{% endif %}"
>
    <div class="d-flex align-items-center gap-2">
        <input 
            class="form-check-input"
            type="checkbox"
            {% if task.is_done %}checked{% endif %}
            hx-post="{% url 'tasks:toggle' task.id %}"
            hx-target="#task-{{ task.id }}"
            hx-swap="outerHTML"
        >
        <span>{{ task.title }}</span>
        <span class="badge bg-secondary">{{ task.get_priority_display }}</span>
        {% if task.deadline %}
            <small class="text-muted">Due {{ task.deadline|date:"M d" }}</small>
        {% endif %}
    </div>

    <div>
        <button
            class="btn btn-sm btn-light"
            hx-get="{% url 'tasks:edit' task.id %}"
            hx-target="#task-{{task.id}}"
            hx-swap="outerHTML"
        >
            ✎
        </button>
        <button
            class="btn btn-sm btn-light"
            hx-delete="{% url 'tasks:delete' task.id %}"
            hx-target="#task-{{ task.id }}"
            hx-swap="outerHTML"
            hx-confirm="Delete this task?"
        >
            ✕
        </button>
    </div>
</div>
